spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
spring.application.name=brainbyte-api
server.port=${API_PORT:3001}
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
server.error.include-message=never

brainbyte.mysql.host=${MYSQL_HOST:127.0.0.1}
brainbyte.mysql.port=${MYSQL_PORT:3306}
brainbyte.mysql.database=${MYSQL_DATABASE:brainbyte}
brainbyte.mysql.user=${MYSQL_USER:}
brainbyte.mysql.password=${MYSQL_PASSWORD:}
brainbyte.mysql.ssl=${MYSQL_SSL:false}

brainbyte.gemini.api-key=${GEMINI_API_KEY:}
brainbyte.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
brainbyte.gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models
